<!DOCTYPE html>
<html>
<head>
    <title>Tambah Mahasiswa</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

{% include 'navbar.html' %}

<div class="container">

    <h2>Tambah Mahasiswa</h2>

    <form method="POST">

        <input
            type="text"
            name="nama"
            placeholder="Nama"
            required
        >

        <input
            type="text"
            name="npm"
            placeholder="NPM"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <input
            type="text"
            name="no_telp"
            placeholder="No Telp"
            required
        >

        <select name="role" required>

            {% for role in roles %}
                <option value="{{ role }}">
                    {{ role }}
                </option>
            {% endfor %}

        </select>

        <button type="submit">
            Simpan
        </button>

    </form>

</div>

</body>
</html>
