<!DOCTYPE html>
<html>
<head>
    <title>Tambah Dosen</title>
</head>
<body>

<h2>Tambah Dosen</h2>

<form method="POST">

    <input type="text"
           name="nama"
           placeholder="Nama"
           required>

    <input type="text"
           name="nidn"
           placeholder="NIDN"
           required>

    <input type="text"
           name="matkul"
           placeholder="Mata Kuliah"
           required>

    <input type="text"
           name="no_telp"
           placeholder="No Telp"
           required>

    <input type="password"
           name="password"
           placeholder="Password Login"
           required>

    <button type="submit">
        Simpan
    </button>

</form>

</body>
</html>
